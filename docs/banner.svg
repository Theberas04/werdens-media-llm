<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Werdens Media LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="55%" stop-color="#eaf3fc"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e73be"/>
      <stop offset="50%" stop-color="#2ea3f2"/>
      <stop offset="100%" stop-color="#1e73be"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2ea3f2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2ea3f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- laag 1: engine -->
  <g transform="translate(96,116)">
    <rect x="0" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.5"/>
    <text x="20" y="34" fill="#1e73be" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">LAAG 1 · ENGINE</text>
    <text x="20" y="60" fill="#0f172a" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="15">Ollama- en OpenAI-API</text>
    <text x="20" y="78" fill="#55657f" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">:11434 · llama.cpp</text>
  </g>

  <!-- laag 2: werkruimte -->
  <g transform="translate(366,116)">
    <rect x="0" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.5"/>
    <text x="20" y="34" fill="#2ea3f2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">LAAG 2 · WERKRUIMTE</text>
    <text x="20" y="60" fill="#0f172a" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="15">Documenten · bronnen</text>
    <text x="20" y="78" fill="#55657f" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">vectordatabase · widget</text>
  </g>

  <!-- laag 3: media -->
  <g transform="translate(636,116)">
    <rect x="0" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.5"/>
    <text x="20" y="34" fill="#1e73be" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">LAAG 3 · MEDIA</text>
    <text x="20" y="60" fill="#0f172a" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="15">Spraak in en uit</text>
    <text x="20" y="78" fill="#55657f" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">beeld · video</text>
  </g>

  <!-- verbindingslijnen -->
  <g stroke="#e3eaf4" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.8">
    <line x1="326" y1="160" x2="366" y2="160"/>
    <line x1="596" y1="160" x2="636" y2="160"/>
  </g>

  <!-- clients -->
  <g transform="translate(900,116)">
    <rect x="0" y="0" width="204" height="88" rx="14" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.5"/>
    <text x="20" y="34" fill="#55657f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">CLIËNTEN</text>
    <text x="20" y="58" fill="#0f172a" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="14">Hermes · eigen apps</text>
    <text x="20" y="76" fill="#55657f" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">elk OpenAI/Ollama-programma</text>
  </g>

  <text x="96" y="72" fill="#0f172a" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Werdens Media LLM</text>
  <rect x="98" y="86" width="360" height="4" rx="2" fill="url(#accent)"/>
  <text x="96" y="264" fill="#55657f" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="16">Je eigen LLM-stack op je eigen server — lokaal, geen abonnement, geen API-sleutel.</text>
  <text x="96" y="290" fill="#8296ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">Proxmox · Debian · llama.cpp · Python</text>
</svg>
